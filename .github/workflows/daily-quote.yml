name: Daily Quote Generation

on:
  schedule:
    # Tous les jours à minuit UTC (1h du matin heure Casablanca en hiver)
    - cron: "* * * * *"
  workflow_dispatch: # Bouton pour lancer manuellement

jobs:
  generate-daily-content:
    runs-on: ubuntu-latest

    steps:
      - name: Call API to generate daily content
        run: |
          echo "🚀 Génération du contenu quotidien..."

          response=$(curl -s -w "\n%{http_code}" -X GET \
            "https://quoter-ebon.vercel.app/api/daily-update?token=${{ secrets.CRON_SECRET }}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "📊 Status HTTP: $http_code"
          echo "📄 Réponse: $body"

          if [ "$http_code" -eq 200 ]; then
            echo "✅ Contenu généré avec succès!"
          else
            echo "❌ Erreur: Status $http_code"
            exit 1
          fi
